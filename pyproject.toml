[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"

[project]
name = "robot_framework"
version = "0.1.0"
authors = [
  { name="ITK Development", email="itk-rpa@mkb.aarhus.dk" },
]
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
]
dependencies = [
    "OpenOrchestrator == 3.*",
    # KontAKT renders the aktliste now (GET /api/v1/cases/<id>/aktliste.pdf),
    # so the "reports" extra (openpyxl + reportlab) is no longer needed here.
    "oomtm @ git+https://github.com/mtm-aarhus/oomtm.git@main",
    "requests >= 2.31",
    "Pillow == 10.*",
]
# INGEN LIBREOFFICE. F2 renderer selv til PDF (rel/pdf-content), saa der er
# ingen konvertering paa robotmaskinen, ingen 350 MB at hente foerste gang og
# ingen fallback-kaede at holde ved lige. Derfor "oomtm" og ikke "oomtm[pdf]".
#
# Pillow bliver: robot_framework/error_screenshot.py importerer PIL, saa den er
# en kerneafhaengighed for HVER robot og maa aldrig fjernes.

[project.optional-dependencies]
dev = [
  "pylint",
  "flake8"
]
